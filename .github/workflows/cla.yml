name: CLA


on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/amurgola/LumaBrowser/blob/main/CONTRIBUTING.md#contributor-license-agreement'
          branch: 'cla-signatures'
          allowlist: amurgola,dependabot[bot]
          custom-notsigned-prcomment: 'Thanks for the pull request. Before it can be merged, please sign the Contributor License Agreement in CONTRIBUTING.md by replying with the sentence below.'
