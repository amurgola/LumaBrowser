<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'none';">
<title>Luma On Demand</title>
<link rel="stylesheet" href="../../llm-server/ui/css/tokens.css">
<link rel="stylesheet" href="on-demand.css">
</head>
<body class="collapsed">
  <button id="tile" class="od-tile" type="button" title="Luma On Demand: talk to this page" aria-label="Open Luma On Demand">
    <svg class="od-mark od-tile-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.4" y="2.4" width="19.2" height="19.2" rx="5.2" stroke="currentColor" stroke-width="1.8"/><path d="M8.4 7H10.7V14.7H16.8V17H8.4Z" fill="currentColor"/><path class="od-mark-light" d="M12.6 7H16.8V11.2Z"/></svg>
    <span class="od-tile-dot" id="tileDot"></span>
  </button>

  <div id="panel" class="od-panel" hidden>
    <header class="od-head" id="head">
      <span class="od-live" id="liveBadge" title="Live: talk or type"><svg class="od-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.4" y="2.4" width="19.2" height="19.2" rx="5.2" stroke="currentColor" stroke-width="1.8"/><path d="M8.4 7H10.7V14.7H16.8V17H8.4Z" fill="currentColor"/><path class="od-mark-light" d="M12.6 7H16.8V11.2Z"/></svg><span class="od-live-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="od-sr">Live</span></span>
      <div class="od-page">
        <span class="od-page-title" id="pageTitle">This page</span>
        <span class="od-page-model" id="modelLabel"></span>
      </div>
      <button id="btnSpeak" class="od-ib" type="button" title="Read replies aloud" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6a1.4 1.4 0 0 1-1 .4H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 18.4a9 9 0 0 0 0-12.8"/></svg>
      </button>
      <button id="btnClose" class="od-ib" type="button" title="Close (Esc)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div id="log" class="od-log" aria-live="polite"></div>

    <div id="hint" class="od-hint"></div>

    <footer class="od-foot">
      <button id="btnMic" class="od-mic" type="button" title="Voice" aria-label="Toggle listening">
        <span class="od-mic-ring"></span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
      </button>
      <input id="txt" class="od-input" type="text" placeholder="Type, or just speak…" autocomplete="off" spellcheck="false">
      <button id="btnSend" class="od-send" type="button" title="Send">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7M12 19V5"/></svg>
      </button>
    </footer>
  </div>

  <script type="module" src="entry.js"></script>
</body>
</html>
